name: YORVYN CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yorvyn_test
          POSTGRES_USER: yorvyn
          POSTGRES_PASSWORD: yorvyn_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U yorvyn -d yorvyn_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run backend pytest suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://yorvyn:yorvyn_ci_password@localhost:5432/yorvyn_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          YORVYN_SECURITY_SECRET: ci-test-security-secret-placeholder
          GARMENT_AI_REMOTE_API_KEY: ci-test-worker-key-placeholder
          GARMENT_AI_REMOTE_SIGNING_SECRET: ci-test-worker-signing-placeholder
        run: |
          cd backend && pytest -q tests/

  frontend-test-and-build:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Frontend production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  security-and-lint:
    name: Lint, SAST, Dependency & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install lint and security scanners
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Run ruff
        run: ruff check backend/app

      - name: Run bandit
        run: bandit -r backend/app -ll -ii

      - name: Run pip-audit
        run: pip-audit -r backend/requirements.txt

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
